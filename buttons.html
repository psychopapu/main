<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling Text Effect con GSAP</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>

        body {
            background: #0a0a0a;
        }

        .luna-link-rolling, .luna-button-rolling {
            position: relative;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.1em;
            border: none;
            overflow: visible;
            display: inline-block;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .luna-link-rolling {
            background: transparent;
            color: #fff;
            border: none;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-thickness: 1px;
        }

        .luna-link-rolling:hover {
            color: #fff;
            text-decoration-color: #3b82f6;
        }

        .luna-button-rolling {
            display: inline-block;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            text-align: center;
            text-decoration: none;
            vertical-align: middle;
            cursor: pointer;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            background-color: transparent;
            border: 1px solid transparent;
            padding: .375rem .75rem;
            font-size: 1rem;
            border-radius: .25rem;
            transition: color .15s ease-in-out, background-color .15s ease-in-out, border-color .15s ease-in-out, box-shadow .15s ease-in-out;
            /* Custom properties to integrate with existing styles */
            align-items: center; /* Added to keep icon and text aligned */
            gap: 6px; /* Added to keep gap between icon and text */
            overflow: hidden; /* Retained from original */
            width: fit-content; /* Retained from original */
            position: relative; /* Retained from original */
        }

        .luna-button-rolling:hover {
            color: #fff; /* Example hover color, adjust as needed */
            background-color: #0d6efd; /* Example hover background, adjust as needed */
            border-color: #0d6efd; /* Example hover border, adjust as needed */
        }

        /* Ensure icon and text colors are consistent */
        .luna-button-rolling,
        .luna-button-rolling .luna-text-rolling,
        .luna-button-rolling .luna-icon .material-icons {
            color: #212529; /* Default text and icon color */
        }

        .luna-button-rolling:hover,
        .luna-button-rolling:hover .luna-text-rolling,
        .luna-button-rolling:hover .luna-icon .material-icons {
            color: #fff; /* Hover text and icon color */
        }


        .luna-button-rolling.luna-send {
            /* Specific styles for luna-send can be adjusted or removed if desired */
            background-color: #198754; /* Example send button background */
            border-color: #198754; /* Example send button border */
            color: #fff;
        }
        .luna-button-rolling.luna-send .luna-text-rolling,
        .luna-button-rolling.luna-send .luna-icon .material-icons {
            color: #fff;
        }

        .luna-button-rolling.luna-send:hover {
            background-color: #157347;
            border-color: #146c43;
            color: #fff;
        }
        .luna-button-rolling.luna-send:hover .luna-text-rolling,
        .luna-button-rolling.luna-send:hover .luna-icon .material-icons {
            color: #fff;
        }


        .material-icons {
            font-size: 18px;
        }

        .luna-text-rolling {
            display: inline-flex;
            overflow: hidden;
        }

        .luna-char {
            display: inline-block;
            position: relative;
            overflow: hidden;
            height: 1.2em;
            min-width: 0.5em;
            margin-right: 0.05em;
        }

        .luna-char-original,
        .luna-char-hover {
            display: inline-block;
            position: relative;
            white-space: nowrap;
        }

        .luna-char-original {
            transform: translateY(0);
        }

        .luna-char-hover {
            position: absolute;
            top: 0;
            left: 0;
            transform: translateY(100%);
        }

        .luna-icon {
            display: inline-block;
            position: relative;
            overflow: hidden;
            height: 1.2em;
            width: 18px;
        }

        .luna-icon-original,
        .luna-icon-hover {
            display: inline-block;
            position: relative;
            font-size: 18px;
        }

        .luna-icon-original {
            transform: translateY(0);
        }

        .luna-icon-hover {
            position: absolute;
            top: 0;
            left: 0;
            transform: translateY(100%);
        }

        .luna-space {
            width: 0.3em;
            height: 1.2em;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .luna-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="luna-container">
        <a href="#" class="luna-link-rolling" data-original="Información" data-hover="Información">
            <span class="luna-text-rolling"></span>
        </a>

        <button class="luna-button-rolling" data-original="Atrás" data-hover="Atrás" data-icon-original="arrow_left" data-icon-hover="arrow_left">
            <span class="luna-icon"></span>
            <span class="luna-text-rolling"></span>
        </button>

        <button class="luna-button-rolling" data-original="Siguiente" data-hover="Siguiente" data-icon-original="arrow_right" data-icon-hover="arrow_right">
            <span class="luna-text-rolling"></span>
            <span class="luna-icon"></span>
        </button>

        <button class="luna-button-rolling" data-original="Adjuntar" data-hover="Adjuntar" data-icon-original="arrow_drop_up" data-icon-hover="arrow_drop_up">
            <span class="luna-icon"></span>
            <span class="luna-text-rolling"></span>
        </button>

        <button class="luna-button-rolling luna-send" data-original="Enviar" data-hover="Enviar" data-icon-original="check_small" data-icon-hover="check_small">
            <span class="luna-text-rolling"></span>
            <span class="luna-icon"></span>
        </button>
    </div>

    <script>
        function createRollingText(element) {
            const originalText = element.dataset.original;
            const hoverText = element.dataset.hover;
            const originalIcon = element.dataset.iconOriginal;
            const hoverIcon = element.dataset.iconHover;

            const rollingTextContainer = element.querySelector('.luna-text-rolling');
            const iconContainer = element.querySelector('.luna-icon');

            // Crear texto rolling
            if (rollingTextContainer) {
                rollingTextContainer.innerHTML = '';

                for (let i = 0; i < originalText.length; i++) {
                    const charContainer = document.createElement('span');
                    charContainer.className = 'luna-char';

                    const originalChar = document.createElement('span');
                    originalChar.className = 'luna-char-original';
                    originalChar.textContent = originalText[i];

                    const hoverChar = document.createElement('span');
                    hoverChar.className = 'luna-char-hover';
                    hoverChar.textContent = hoverText[i] || '';

                    charContainer.appendChild(originalChar);
                    charContainer.appendChild(hoverChar);
                    rollingTextContainer.appendChild(charContainer);
                }
            }

            // Crear icono rolling
            if (iconContainer && originalIcon) {
                iconContainer.innerHTML = '';

                const originalIconEl = document.createElement('span');
                originalIconEl.className = 'luna-icon-original material-icons';
                originalIconEl.textContent = originalIcon;

                const hoverIconEl = document.createElement('span');
                hoverIconEl.className = 'luna-icon-hover material-icons';
                hoverIconEl.textContent = hoverIcon || originalIcon;

                iconContainer.appendChild(originalIconEl);
                iconContainer.appendChild(hoverIconEl);
            }

            // Crear animaciones GSAP
            const chars = element.querySelectorAll('.luna-char');
            const icons = element.querySelectorAll('.luna-icon');

            const tl = gsap.timeline({ paused: true });

            // Animar caracteres
            chars.forEach((char, index) => {
                const original = char.querySelector('.luna-char-original');
                const hover = char.querySelector('.luna-char-hover');

                tl.to(original, {
                    y: '-100%',
                    duration: 0.4,
                    ease: 'power2.out'
                }, index * 0.03)
                .to(hover, {
                    y: '0%',
                    duration: 0.4,
                    ease: 'power2.out'
                }, index * 0.03);
            });

            // Animar iconos
            icons.forEach((icon, index) => {
                const original = icon.querySelector('.luna-icon-original');
                const hover = icon.querySelector('.luna-icon-hover');

                if (original && hover) {
                    tl.to(original, {
                        y: '-100%',
                        duration: 0.4,
                        ease: 'power2.out'
                    }, index * 0.03)
                    .to(hover, {
                        y: '0%',
                        duration: 0.4,
                        ease: 'power2.out'
                    }, index * 0.03);
                }
            });

            // Event listeners
            element.addEventListener('mouseenter', () => {
                tl.play();
            });

            element.addEventListener('mouseleave', () => {
                tl.reverse();
            });
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            const rollingElements = document.querySelectorAll('.luna-link-rolling, .luna-button-rolling');

            rollingElements.forEach(element => {
                createRollingText(element);
            });

            // Efectos adicionales
            const link = document.querySelector('.luna-link-rolling');
            const button = document.querySelector('.luna-button-rolling');

            link.addEventListener('click', (e) => {
                e.preventDefault();
                console.log('Link clicked!');
            });

            button.addEventListener('click', () => {
                console.log('Button clicked!');
            });
        });
    </script>
</body>
</html>
